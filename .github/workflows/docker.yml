name: Docker

# Builds the broker image from this repository's source (including the
# security backports) and publishes it to the GitHub Container Registry of
# the repository owner. Pull requests only build, they never publish.

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.*'
  pull_request:
    paths:
      - 'docker/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        base_image:
          - alpine
          - ubuntu

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Prepare source tarball and image metadata
      id: prep
      run: |
        version="$(git describe --tags --always)"
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        image="ghcr.io/${owner}/mosquitto"
        git archive --format=tar.gz --prefix=mosquitto/ -o "docker/2.1-${{ matrix.base_image }}/mosq.tar.gz" HEAD
        {
          echo "version=${version}"
          echo "tags<<EOF"
          echo "${image}:2.1-${{ matrix.base_image }}"
          echo "${image}:${version}-${{ matrix.base_image }}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: ${{ github.event_name != 'pull_request' }}
        platforms: linux/amd64, linux/arm64
        context: docker/2.1-${{ matrix.base_image }}
        file: docker/fork/Dockerfile.${{ matrix.base_image }}
        build-args: |
          VERSION=${{ steps.prep.outputs.version }}
        tags: ${{ steps.prep.outputs.tags }}
